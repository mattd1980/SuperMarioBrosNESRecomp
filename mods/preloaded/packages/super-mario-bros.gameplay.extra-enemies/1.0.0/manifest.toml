format_version = 1
id = "super-mario-bros.gameplay.extra-enemies"
version = "1.0.0"
name = "Extra Enemies: World 1-1"
author = "NESRecomp"
description = "Adds Goombas and green Koopa Troopas to World 1-1. They spawn through the game's own enemy initialization, so they walk, stomp, kick and score like the originals. The ROM is unchanged."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "super-mario-bros-world"
rom_crc32 = "d445f698"

[[feature]]
id = "extra-enemies"
name = "Extra Enemies: World 1-1"
description = "Ten more enemies across 1-1's open ground: seven Goombas and three green Koopas. The original five-enemy limit still applies, so a spawn is skipped while every slot is busy. Local play only."
group = "Gameplay"
default_enabled = false

[[plugin]]
feature = "extra-enemies"
id = "super-mario-bros.extra-enemies"
