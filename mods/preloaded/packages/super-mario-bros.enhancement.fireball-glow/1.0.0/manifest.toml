format_version = 1
id = "super-mario-bros.enhancement.fireball-glow"
version = "1.0.0"
name = "Fireball Glow"
author = "NESRecomp"
description = "Fireballs cast a flickering warm light on their surroundings and leave a trail of rising embers. Castle firebars, explosions and fireworks glow too. Presentation only: game logic, the ROM and save states are unchanged."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "super-mario-bros-world"
rom_crc32 = "d445f698"

[[feature]]
id = "fireball-glow"
name = "Fireball Glow"
description = "A light source and a flame trail for every fireball, firebar, explosion and firework."
group = "Display"
default_enabled = true

[[plugin]]
feature = "fireball-glow"
id = "super-mario-bros.fireball-glow"

[[option]]
feature = "fireball-glow"
id = "strength"
label = "Strength"
type = "choice"
default = "normal"
[[option.choice]]
value = "subtle"
label = "Subtle"
[[option.choice]]
value = "normal"
label = "Normal"
[[option.choice]]
value = "strong"
label = "Strong"

[[option]]
feature = "fireball-glow"
id = "flames"
label = "Flame trail"
type = "boolean"
default = true
