format_version = 1
id = "super-mario-bros.enhancement.impact-effects"
version = "1.0.0"
name = "Impact Effects"
author = "NESRecomp"
description = "Small effects where things happen: a dust puff when Mario stomps an enemy, a burst of fire when a fireball defeats one, sparks for shell and star hits, dust when a brick breaks, and a fiery explosion when Bowser goes down. Presentation only: game logic, the ROM and save states are unchanged."
license = "MIT"
resolver = "declarative"
save_compatibility = "stock"

[[target]]
game_id = "super-mario-bros-world"
rom_crc32 = "d445f698"

[[feature]]
id = "impact-effects"
name = "Impact Effects"
description = "Puffs, sparks and explosions on stomps, defeated enemies, broken bricks and Bowser's defeat. No screen shake."
group = "Display"
default_enabled = true

[[plugin]]
feature = "impact-effects"
id = "super-mario-bros.impact-effects"

[[option]]
feature = "impact-effects"
id = "strength"
label = "Strength"
type = "choice"
default = "subtle"
[[option.choice]]
value = "subtle"
label = "Subtle"
[[option.choice]]
value = "normal"
label = "Normal"
[[option.choice]]
value = "strong"
label = "Strong"

[[option]]
feature = "impact-effects"
id = "stomp"
label = "Stomp puffs and hit sparks"
type = "boolean"
default = true

[[option]]
feature = "impact-effects"
id = "fireball"
label = "Fireball kill bursts"
type = "boolean"
default = true

[[option]]
feature = "impact-effects"
id = "bricks"
label = "Brick dust"
type = "boolean"
default = true

[[option]]
feature = "impact-effects"
id = "bowser"
label = "Bowser explosion"
type = "boolean"
default = true
